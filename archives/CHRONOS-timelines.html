<main id="workspace" class="game-shell at-home">
  <div class="world-stage" id="world-stage" aria-label="Explorable city world">
    <div class="viewport active-viewport"><div id="city-view" class="city-canvas"></div><div class="view-label game-hud"><span class="status-dot"></span><span id="view-label">ORIGINAL TIMELINE</span></div></div>
    <div class="viewport original-viewport" hidden><div id="original-view" class="city-canvas"></div><div class="view-label baseline-label">${Z(`clock`)} ORIGINAL / UNCHANGED</div></div>
    <div class="loading-city" id="loading-city"><span class="loading-ring"></span><span>Entering New Meridian</span></div>
  </div>
  <div class="world-vignette" aria-hidden="true"></div><div class="screen-grain" aria-hidden="true"></div>

  <section class="home-screen" id="home-screen" aria-labelledby="home-title">
    <div class="home-top"><span class="home-emblem">${Z(`clock`)}</span><span>THE BUTTERFLY ENGINE</span><span class="home-build">A CITY SIMULATION</span></div>
    <div class="home-content"><div class="home-eyebrow"><span class="status-dot"></span> NEW MERIDIAN / <span id="home-state">LIVE WORLD</span></div><h1 id="home-title">CHRONOS<span>EVERY MOMENT IS A CROSSROADS.</span></h1><div class="home-rule"></div><p class="home-lede">One city. Forty-eight lives.<br>Change a single moment.<br>Watch a different world unfold.</p><div class="home-buttons"><button id="enter-world" class="primary-button">${Z(`play`)}<span>${od?`Resume your world`:`Enter New Meridian`}</span>${Z(`arrow`)}</button><button id="home-guide" class="quiet-button">${Z(`help`)} How to play</button></div><div class="home-controls"><span>360° EXPLORATION</span><i></i><span>A LIVING POPULATION</span><i></i><span>BRANCHING TIME</span></div></div>
    <div class="home-world-label"><span class="crosshair" aria-hidden="true"></span><div><span>WORLD 001</span><strong>NEW MERIDIAN</strong><small>WESTHAVEN + EASTBANK</small></div></div>
    <footer class="home-footer"><span>A fictional world. Real consequences within it.</span><span>DRAG TO EXPLORE THE CITY ${Z(`arrow`)}</span></footer>
  </section>

  <header class="topbar game-hud">
    <div class="game-identity"><button id="home-toggle" class="wordmark" aria-label="Open main menu" title="Main menu (Escape)"><span class="brand-mark">${Z(`clock`)}</span><span>CHRONOS<small>THE BUTTERFLY ENGINE</small></span></button><div class="city-id"><span>NEW MERIDIAN</span><b id="active-name">Original</b></div></div>
    <div class="metrics" aria-label="City indicators">${[[`wellbeing`,`WELLBEING`,`%`,`health`],[`power`,`POWER`,`%`,`power`],[`supply`,`SUPPLIES`,`%`,`leaf`],[`travel`,`JOURNEY`,`min`,`clock`]].map(([e,t,n,r])=>`<div class="metric" data-metric="${e}"><div class="metric-title">${Z(r)}${t}</div><div class="metric-value"><strong>—</strong><span>${n}</span></div><div class="metric-detail">Original timeline</div></div>`).join(``)}</div>
    <div class="topbar-actions"><button id="compare-toggle" class="compare-button" disabled title="Create an alternate timeline first" aria-label="Compare futures">${Z(`compare`)}<span>Compare futures</span></button><button id="sound-toggle" class="icon-button" aria-label="Turn ambient sound on" aria-pressed="false" title="Ambient sound">${Z(`muted`)}</button><button id="guide-button" class="icon-button" aria-label="How to play" title="How to play">${Z(`help`)}</button><button id="hud-toggle" class="icon-button" aria-label="Hide interface" title="Hide interface (H)">${Z(`eye`)}</button><button id="fullscreen-toggle" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen">${Z(`target`)}</button></div>
  </header>

  <div class="world-population game-hud"><span class="status-dot"></span><span><b id="citizen-count">48</b> RESIDENTS</span><i></i><span><b id="moving-count">0</b> MOVING</span><i></i><span><b id="working-count">0</b> WORKING</span></div>
  <nav class="command-rail game-hud" aria-label="Game commands"><button data-panel="interventions" aria-controls="interventions-panel" aria-expanded="false">${Z(`power`)}<span>Intervene</span><kbd>I</kbd></button><button data-panel="inspector" aria-controls="inspector-panel" aria-expanded="false">${Z(`eye`)}<span>Citizens</span><kbd>N</kbd></button><button data-panel="timelines" aria-controls="timelines-panel" aria-expanded="false">${Z(`branch`)}<span>Timelines</span><kbd>T</kbd></button></nav>

  <aside id="interventions-panel" class="floating-panel left-panel game-hud" hidden aria-label="Interventions"><div class="panel-heading"><div><span class="eyebrow">ALTER THE COURSE</span><h2>Interventions</h2></div><button data-close-panel class="icon-button" aria-label="Close interventions">${Z(`close`)}</button></div><p class="panel-intro">Every decision creates a new timeline. The original world stays intact.</p><div class="interventions">${Md.map(e=>`<button class="intervention ${e.color}" data-intervention="${e.type}"><span class="intervention-icon">${Z(e.icon)}</span><span class="intervention-copy"><span class="intervention-tag">${e.tag} / ${e.number}</span><span class="intervention-title">${e.title}${Z(`plus`)}</span><span class="intervention-description">${e.subtitle}</span></span></button>`).join(``)}</div><div class="panel-footnote">${Z(`branch`)} Select a decision, then compare its future.</div></aside>

  <aside id="inspector-panel" class="floating-panel right-panel game-hud" hidden aria-label="Citizen and building inspector"><div class="panel-heading"><div><span class="eyebrow">EVERY LIFE HAS A ROUTINE</span><h2>City life</h2></div><button data-close-panel class="icon-button" aria-label="Close citizen inspector">${Z(`close`)}</button></div><label class="picker-label" for="entity-picker">SELECT A RESIDENT OR PLACE</label><select id="entity-picker"><option value="">City overview</option></select><div id="inspector-body" class="inspector-body"></div></aside>

  <aside id="timelines-panel" class="floating-panel right-panel game-hud" hidden aria-label="Timelines and saved worlds"><div class="panel-heading"><div><span class="eyebrow">POSSIBILITIES, PRESERVED</span><h2>Your timelines <span id="branch-count" class="count-badge">1 / 8</span></h2></div><button data-close-panel class="icon-button" aria-label="Close timelines">${Z(`close`)}</button></div><div id="branch-list" class="branch-list" aria-label="Choose a timeline"></div><div class="world-tools"><div class="storage-label"><span class="status-dot" id="storage-dot"></span><span id="storage-status">Autosave ready</span></div><div class="storage-actions"><button id="save-button" class="light-button">${Z(`save`)} Save</button><button id="export-button" class="light-button">${Z(`download`)} Export</button><button id="import-button" class="light-button">${Z(`upload`)} Import</button></div><button id="recovery-button" class="recovery-button" hidden>Download unreadable save for recovery</button><button id="reset-button" class="reset-button">${Z(`reset`)} Start a new day</button></div><div class="dispatch-heading"><h3>CITY SIGNALS</h3><span class="status-dot"></span></div><ol id="event-log" class="event-log"></ol></aside>

  <div class="map-tools game-hud"><div class="map-layers" role="group" aria-label="Map layer"><button data-layer="city" class="active" aria-pressed="true">City</button><button data-layer="power" aria-pressed="false">Power</button><button data-layer="wellbeing" aria-pressed="false">Wellbeing</button><button data-layer="routes" aria-pressed="false">Routes</button></div><div class="layer-legend" id="layer-legend" hidden></div></div>
  <div class="camera-controls game-hud" role="group" aria-label="Camera mode"><span>CAMERA</span><button data-camera="orbit" class="active" aria-pressed="true" title="360 degree orbit camera">360°</button><button data-camera="street" aria-pressed="false" title="Street-level camera">Street</button><button data-camera="top" aria-pressed="false" title="Top-down city view">Top</button><button id="reset-camera" class="icon-button" aria-label="Reset camera view" title="Reset view">${Z(`target`)}</button></div>
  <button id="stop-follow" class="follow-chip game-hud" hidden aria-label="Stop following resident">${Z(`target`)}<span></span>${Z(`close`)}</button>
  <div class="camera-hint game-hud" id="map-hint">DRAG TO ORBIT · RIGHT-DRAG TO PAN · SCROLL TO ZOOM</div>
  <section class="time-console game-hud" aria-label="Timeline controls"><div class="time-controls"><button id="rewind-button" class="icon-button" aria-label="Rewind to 08:00" title="Rewind to start">${Z(`rewind`)}</button><button id="play-toggle" class="play-button" aria-label="Play simulation" title="Play / pause (Space)">${Z(`play`)}</button><div class="digital-time"><strong id="current-time">08:00</strong><span id="play-status">TIME IS PAUSED</span></div><div class="speed-group" role="group" aria-label="Simulation speed"><button data-speed="1" class="active" aria-pressed="true">1×</button><button data-speed="4" aria-pressed="false">4×</button><button data-speed="12" aria-pressed="false">12×</button></div><div class="timeline-caption"><span>THE FUTURE IS NOT WRITTEN.</span><small>DRAG THE TIMELINE TO REWRITE IT.</small></div><div class="day-label">DAY <b>01</b></div></div><div class="scrubber"><div id="timeline-markers" class="timeline-markers" aria-hidden="true"></div><input type="range" id="time-slider" min="0" max="720" value="0" step="1" aria-label="Simulation time" aria-valuetext="08:00"/><div class="time-ticks"><span>08:00</span><span>11:00</span><span>14:00</span><span>17:00</span><span>20:00</span></div></div></section>
  <button id="show-hud" class="hud-return" hidden>${Z(`eye`)} Show controls <kbd>H</kbd></button><span class="world-disclaimer game-hud">FICTIONAL CITY SIMULATION</span>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="announcer" class="sr-only" role="status" aria-live="polite"></div><input id="import-file" type="file" accept=".json,application/json" hidden />
